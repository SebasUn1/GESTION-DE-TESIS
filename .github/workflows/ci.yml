name: CI

# Corre en cada PR (para enterarse antes de mergear, no después) y en cada push a
# main. Las imágenes Docker se publican solo si esto pasa: ver imagen-*.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior, que ya no importa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests con PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tesistrack-app

    steps:
      - name: Bajar el código
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Los tests de integración levantan su propio PostgreSQL con Testcontainers:
      # el runner ya trae Docker, no hace falta un servicio aparte.
      - name: Compilar y correr los tests
        run: ./mvnw -B verify

      - name: Guardar los reportes si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-backend
          path: tesistrack-app/target/surefire-reports/

  frontend:
    name: Frontend (lint, tests y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tesistrack-web

    steps:
      - name: Bajar el código
        uses: actions/checkout@v7

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tesistrack-web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build de producción
        run: npm run build
