name: Imagen Docker Frontend

# Solo se publica lo que pasó el CI: antes se publicaba en cada push a main,
# aunque los tests fallaran.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    # Además de que el CI haya pasado, tiene que ser un push a este repo: el filtro
    # branches mira el nombre de la rama, y un PR desde un fork con una rama
    # llamada "main" también lo cumple. Sin esto, un desconocido publicaba :latest.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest

    steps:
      # El commit que probó el CI, no el último de main (podría haber llegado otro).
      - name: Bajar el código
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Nombre de la imagen (ghcr.io exige minúsculas)
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"
          echo "CORTO=${SHA::7}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: ./tesistrack-web
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:sha-${{ env.CORTO }}