spring.application.name=tesistrack

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tesistrack}
spring.datasource.username=${DB_USER:tesistrack}
spring.datasource.password=${DB_PASSWORD:tesistrack}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway versiona el esquema. Hibernate solo comprueba que las entidades y la BD coincidan.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.schemas=public
spring.jpa.hibernate.ddl-auto=validate
# Cada consulta en el log sirve para depurar, no en producción: ver application-dev.properties.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Detrás de nginx (Docker) todas las requests llegan desde la IP del contenedor del
# frontend. Con esto Tomcat toma la IP real de X-Forwarded-For, que nginx completa;
# sin eso, los límites por IP de LimitadorConsultas eran uno solo para todo el mundo.
# Solo confía en el encabezado si viene de una red interna (el default de Tomcat).
server.forward-headers-strategy=native

# Los documentos de las entregas se guardan en la base (ver ArchivoEntrega). El
# tope real lo valida EntregaService.TAMANO_MAXIMO; esto solo corta antes de que
# el request entero quede en memoria.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

# Obligatoria y sin default: JwtService no arranca sin ella. En desarrollo la pone el
# perfil dev; en Docker, el compose.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Version de la politica de privacidad vigente. Se guarda junto al consentimiento
# de cada usuario: si el texto cambia, subir esta version para poder distinguir
# quien acepto que texto.
app.politica.version=2026-10-07
