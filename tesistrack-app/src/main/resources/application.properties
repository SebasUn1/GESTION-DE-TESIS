spring.application.name=tesistrack

# Render inyecta PORT; en local sigue siendo 8080.
server.port=${PORT:8080}

# Health check para Render (/actuator/health). Solo se expone health.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tesistrack}${DB_PARAMS:}
spring.datasource.username=${DB_USER:tesistrack}
spring.datasource.password=${DB_PASSWORD:tesistrack}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway versiona el esquema. Hibernate solo comprueba que las entidades y la BD coincidan.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.schemas=public
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Los documentos de las entregas se guardan en la base (ver ArchivoEntrega). El
# tope real lo valida EntregaService.TAMANO_MAXIMO; esto solo corta antes de que
# el request entero quede en memoria.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-this-in-production-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Version de la politica de privacidad vigente. Se guarda junto al consentimiento
# de cada usuario: si el texto cambia, subir esta version para poder distinguir
# quien acepto que texto.
app.politica.version=2026-08-16
