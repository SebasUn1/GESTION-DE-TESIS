# Perfil de desarrollo local: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# La clave de abajo es pública (está en GitHub): sirve solo para tokens de una base
# local. Producción no activa este perfil y tiene que traer su propio JWT_SECRET.
app.jwt.secret=${JWT_SECRET:solo-desarrollo-local-esta-clave-es-publica-2026}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
